<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600"
     font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f7a4d"/>
    </marker>
  </defs>

  <rect width="980" height="600" rx="10" fill="#f6f8fa"/>
  <line x1="490" y1="40" x2="490" y2="560" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ============ LEFT : v1 ripple chain ============ -->
  <text x="245" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#c0392b">v1 — priority if-chain</text>
  <text x="245" y="72" text-anchor="middle" font-size="14" fill="#5b6472">logic depth O(N) — every stage waits for the one above</text>

  <g font-size="13" fill="#24292f">
    <rect x="160" y="95"  width="170" height="30" rx="5" fill="#fdeceb" stroke="#c0392b"/>
    <text x="245" y="115" text-anchor="middle">check bit 1023 → found?</text>

    <rect x="160" y="150" width="170" height="30" rx="5" fill="#fdeceb" stroke="#c0392b"/>
    <text x="245" y="170" text-anchor="middle">check bit 1022 → found?</text>

    <rect x="160" y="205" width="170" height="30" rx="5" fill="#fdeceb" stroke="#c0392b"/>
    <text x="245" y="225" text-anchor="middle">check bit 1021 → found?</text>

    <text x="245" y="272" text-anchor="middle" font-size="22" fill="#c0392b">⋮</text>

    <rect x="160" y="300" width="170" height="30" rx="5" fill="#fdeceb" stroke="#c0392b"/>
    <text x="245" y="320" text-anchor="middle">check bit 0 → found?</text>
  </g>

  <g stroke="#c0392b" stroke-width="1.6" marker-end="url(#arb)" fill="none">
    <line x1="245" y1="125" x2="245" y2="146"/>
    <line x1="245" y1="180" x2="245" y2="201"/>
    <line x1="245" y1="235" x2="245" y2="252"/>
    <line x1="245" y1="282" x2="245" y2="296"/>
    <line x1="245" y1="330" x2="245" y2="360"/>
  </g>

  <path d="M345,100 L365,100 L365,325 L345,325" stroke="#c0392b" stroke-width="1.4" fill="none"/>
  <text x="375" y="205" font-size="13" fill="#c0392b" font-weight="600">1024 stages</text>
  <text x="375" y="223" font-size="13" fill="#c0392b" font-weight="600">in series</text>

  <rect x="120" y="365" width="250" height="34" rx="6" fill="#c0392b"/>
  <text x="245" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">63.7 ns  ·  15.7 MHz max</text>

  <text x="245" y="430" text-anchor="middle" font-size="13" fill="#5b6472">a single combinational path —</text>
  <text x="245" y="449" text-anchor="middle" font-size="13" fill="#5b6472">caps the entire design's clock</text>

  <!-- ============ RIGHT : v2 radix tree ============ -->
  <text x="735" y="48" text-anchor="middle" font-size="19" font-weight="700" fill="#1f7a4d">v2 — radix-32 tree</text>
  <text x="735" y="72" text-anchor="middle" font-size="14" fill="#5b6472">logic depth O(log N) — 32 sub-problems solved at once</text>

  <rect x="530" y="92" width="410" height="28" rx="5" fill="#eaf1f8" stroke="#4a6fa5"/>
  <text x="735" y="111" text-anchor="middle" font-size="13" fill="#24292f">1024-bit occupancy mask</text>

  <g stroke="#5b6472" stroke-width="1.3" marker-end="url(#ar)" fill="none">
    <line x1="562" y1="120" x2="562" y2="150"/>
    <line x1="646" y1="120" x2="646" y2="150"/>
    <line x1="730" y1="120" x2="730" y2="150"/>
    <line x1="908" y1="120" x2="908" y2="150"/>
  </g>

  <g font-size="11" fill="#24292f">
    <rect x="530" y="153" width="64" height="40" rx="5" fill="#e6f4ec" stroke="#1f7a4d"/>
    <text x="562" y="170" text-anchor="middle">find_</text><text x="562" y="184" text-anchor="middle">lowest</text>
    <rect x="614" y="153" width="64" height="40" rx="5" fill="#e6f4ec" stroke="#1f7a4d"/>
    <text x="646" y="170" text-anchor="middle">find_</text><text x="646" y="184" text-anchor="middle">lowest</text>
    <rect x="698" y="153" width="64" height="40" rx="5" fill="#e6f4ec" stroke="#1f7a4d"/>
    <text x="730" y="170" text-anchor="middle">find_</text><text x="730" y="184" text-anchor="middle">lowest</text>
    <text x="820" y="180" text-anchor="middle" font-size="20" fill="#1f7a4d">· · ·</text>
    <rect x="876" y="153" width="64" height="40" rx="5" fill="#e6f4ec" stroke="#1f7a4d"/>
    <text x="908" y="170" text-anchor="middle">find_</text><text x="908" y="184" text-anchor="middle">lowest</text>
  </g>
  <text x="735" y="212" text-anchor="middle" font-size="12.5" fill="#1f7a4d" font-weight="600">
    32 leaves, ALL IN PARALLEL · each emits 5-bit local addr + hit flag
  </text>

  <rect x="530" y="224" width="410" height="26" rx="4" fill="#4a6fa5"/>
  <text x="735" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">pipeline register — cycle 1</text>

  <line x1="735" y1="250" x2="735" y2="278" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arg)"/>

  <rect x="592" y="281" width="286" height="74" rx="6" fill="#e6f4ec" stroke="#1f7a4d"/>
  <text x="735" y="302" text-anchor="middle" font-size="12.5" fill="#24292f">grp_oh = hits &amp; (~hits + 1)</text>
  <text x="735" y="321" text-anchor="middle" font-size="12.5" fill="#24292f">grp_sel = onehot2bin_gen(grp_oh)</text>
  <text x="735" y="340" text-anchor="middle" font-size="12.5" fill="#24292f">local = leaf_addr_q[grp_sel]</text>
  <text x="735" y="372" text-anchor="middle" font-size="12" fill="#5b6472">the same two primitives, one level up</text>

  <line x1="735" y1="378" x2="735" y2="398" stroke="#5b6472" stroke-width="1.3" marker-end="url(#arg)"/>

  <rect x="530" y="401" width="410" height="26" rx="4" fill="#4a6fa5"/>
  <text x="735" y="419" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">output register — cycle 2</text>

  <line x1="735" y1="427" x2="735" y2="447" stroke="#5b6472" stroke-width="1.3" marker-end="url(#ar)"/>

  <rect x="640" y="450" width="190" height="30" rx="5" fill="#eaf1f8" stroke="#4a6fa5"/>
  <text x="735" y="470" text-anchor="middle" font-size="13" fill="#24292f">addr = {grp_sel, local}</text>
  <text x="735" y="499" text-anchor="middle" font-size="12" fill="#5b6472">concatenation IS ×32 + offset — zero gates</text>

  <rect x="610" y="512" width="250" height="34" rx="6" fill="#1f7a4d"/>
  <text x="735" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">12.4 ns  ·  161 MHz</text>

  <!-- footer -->
  <text x="490" y="580" text-anchor="middle" font-size="13" fill="#24292f">
    <tspan font-weight="700">Adding 2 pipeline stages made it 3.2× faster</tspan>
    <tspan fill="#5b6472"> — cycles only matter multiplied by an achievable period</tspan>
  </text>
</svg>
